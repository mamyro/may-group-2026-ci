name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SCM
        uses: actions/checkout@v4
        
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pytest flask-testing


      - name: Run unit test
        run: pytest